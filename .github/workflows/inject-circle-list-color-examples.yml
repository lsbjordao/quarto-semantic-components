name: Inject circle-list color examples

on:
  push:
    branches:
      - docs/circle-list-color-examples-4

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/circle-list-color-examples-4
      - name: Inject examples
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.qmd')
          text = index.read_text()
          marker = '## A compact procedure\n'
          insert = '''## Custom colors\n\nThe circle border, number, and fill can be styled independently. Unsuffixed values apply to both themes.\n\n```markdown\n::: {.circle-list\n  border-color="#7c3aed"\n  text-color="#ffffff"\n  background-color="#7c3aed"}\n1. Research\n2. Prototype\n3. Validate\n4. Release\n:::\n```\n\n**Output:**\n\n::: {.circle-list border-color="#7c3aed" text-color="#ffffff" background-color="#7c3aed"}\n1. Research\n2. Prototype\n3. Validate\n4. Release\n:::\n\n## Light and dark colors\n\nUse `-light` and `-dark` when the marker needs different contrast in each color mode.\n\n```markdown\n::: {.circle-list\n  border-color-light="#2563eb"\n  border-color-dark="#60a5fa"\n  text-color-light="#1e3a8a"\n  text-color-dark="#f8fafc"\n  background-color-light="#dbeafe"\n  background-color-dark="#1e3a8a"}\n1. Install\n2. Configure\n3. Compose\n4. Publish\n:::\n```\n\n**Output:**\n\n::: {.circle-list border-color-light="#2563eb" border-color-dark="#60a5fa" text-color-light="#1e3a8a" text-color-dark="#f8fafc" background-color-light="#dbeafe" background-color-dark="#1e3a8a"}\n1. Install\n2. Configure\n3. Compose\n4. Publish\n:::\n\nThe canonical options are `border-color`, `text-color`, and `background-color`, each with optional `-light` and `-dark` variants.\n\n'''
          if '## Custom colors\n\nThe circle border' not in text:
              if marker not in text:
                  raise SystemExit('index marker not found')
              text = text.replace(marker, insert + marker, 1)
              index.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          marker = '## Git tree: a commit graph, not just a visual tree\n'
          insert = '''Theme-aware marker colors can be controlled independently:\n\n```markdown\n::: {.circle-list\n  border-color-light="#2563eb" border-color-dark="#60a5fa"\n  text-color-light="#1e3a8a" text-color-dark="#f8fafc"\n  background-color-light="#dbeafe" background-color-dark="#1e3a8a"}\n1. Research\n2. Prototype\n3. Validate\n4. Release\n:::\n```\n\n`border-color`, `text-color`, and `background-color` also accept unsuffixed values that apply to both themes.\n\n'''
          if 'Theme-aware marker colors can be controlled independently:' not in text:
              if marker not in text:
                  raise SystemExit('README marker not found')
              text = text.replace(marker, insert + marker, 1)
              readme.write_text(text)
          PY
      - name: Commit documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inject-circle-list-color-examples.yml
          git add index.qmd README.md
          git commit -m "docs: add circle-list color examples"
          git push origin HEAD:docs/circle-list-color-examples-4

name: Integrate roadmap documentation

on:
  push:
    branches:
      - feat/roadmap
    paths:
      - scripts/integrate-roadmap-docs.py
      - .github/workflows/roadmap-integration.yml

permissions:
  contents: write

jobs:
  integrate-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Integrate roadmap documentation
        run: python3 scripts/integrate-roadmap-docs.py

      - name: Render HTML, PDF, and DOCX with Quarto
        run: bash scripts/render-docs.sh

      - name: Commit generated documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
            exit 0
          fi
          git commit -m "docs: integrate roadmap and refresh rendered outputs"
          git push origin "HEAD:${GITHUB_REF_NAME}"

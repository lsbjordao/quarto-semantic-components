<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Quarto Semantic Components logo</title>
  <desc id="desc">The official Quarto quartered-circle icon behind a centered document containing semantic component symbols, with a short tail suggesting a Q.</desc>
  <defs>
    <linearGradient id="paper" x1="174" y1="108" x2="346" y2="414" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F8FC"/>
    </linearGradient>
    <linearGradient id="fold" x1="318" y1="108" x2="384" y2="174" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DCE8F6"/>
      <stop offset="1" stop-color="#C8D7E8"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0F172A" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- Official Quarto icon geometry, scaled from quarto-dev/quarto-web/quarto-icon.svg -->
  <g transform="translate(76 64) scale(3)" fill="#74AADB" fill-rule="evenodd" clip-rule="evenodd">
    <path d="M55.8,56.8V1C26.1,3.1,2.6,27.1,1,56.8H55.8z"/>
    <path d="M63.2,56.8H119C117.4,26.8,93.2,2.6,63.2,1V56.8z"/>
    <path d="M55.8,64.2H1.1c2.1,29.2,25.4,52.6,54.6,54.6V64.2z"/>
    <path d="M63.2,64.2V119c29.7-1.6,53.7-25.1,55.7-54.7H63.2z"/>
  </g>

  <!-- Small tail turns the background mark into a subtle Q -->
  <path d="M363 351L421 409" stroke="#74AADB" stroke-width="26" stroke-linecap="round"/>

  <!-- Centered file -->
  <g filter="url(#shadow)">
    <path d="M184 108H318L382 172V376C382 397 365 414 344 414H184C163 414 146 397 146 376V146C146 125 163 108 184 108Z"
          fill="url(#paper)" stroke="#D8E1EC" stroke-width="6" stroke-linejoin="round"/>
    <path d="M318 108V146C318 160 330 172 344 172H382L318 108Z" fill="url(#fold)"/>
  </g>

  <!-- Semantic elements remain fully inside the file -->
  <rect x="190" y="176" width="128" height="15" rx="7.5" fill="#C8D3E1"/>
  <rect x="190" y="204" width="92" height="15" rx="7.5" fill="#DEE5EE"/>

  <path d="M208 258V330" stroke="#9DC5EA" stroke-width="7" stroke-linecap="round"/>
  <circle cx="208" cy="258" r="13" fill="#39729E"/>
  <circle cx="208" cy="294" r="13" fill="#3FA7A3"/>
  <circle cx="208" cy="330" r="13" fill="#7567C8"/>
  <rect x="238" y="249" width="94" height="17" rx="8.5" fill="#BFD8EE"/>
  <rect x="238" y="285" width="112" height="17" rx="8.5" fill="#BDE8E3"/>
  <rect x="238" y="321" width="98" height="17" rx="8.5" fill="#D8D1F3"/>

  <path d="M272 358V371M226 371H318M226 371V385M272 371V385M318 371V385"
        fill="none" stroke="#D8A11F" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="272,344 283,358 272,372 261,358" fill="#D8A11F"/>
  <rect x="207" y="386" width="38" height="15" rx="7.5" fill="#39729E"/>
  <rect x="253" y="386" width="38" height="15" rx="7.5" fill="#3FA7A3"/>
  <rect x="299" y="386" width="38" height="15" rx="7.5" fill="#7567C8"/>
</svg>

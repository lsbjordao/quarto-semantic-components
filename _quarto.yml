project:
  type: default

lang: en

# Quarto Semantic Components project defaults.
# These values are inherited by every .qmd in the project.
extensions:
  badge:
    - key: stable
      label: Stable
      type: success
      appearance: solid
      icon: "✓"
    - key: experimental
      label: Experimental
      type: info
      appearance: outline
      icon: "⚗"
    - key: deprecated
      label: Deprecated
      type: danger
      appearance: soft
      icon: "!"

  steps:
    dot-size: "0.72rem"
    line-width: "1.5px"

  tree:
    expanded: true
    indent: "1.5rem"

  file-tree:
    icons: devicon
    expanded: true
    indent: "1.8rem"

  properties:
    term-width: "9rem"

  git-tree:
    direction: TB
    line-width: "2px"
    node-size: "0.68rem"
    lane-gap: "0.82rem"
    row-height: "36px"
    content-gap: "0.55rem"

  article:
    radius: "0.75rem"
    padding: "1rem 1.1rem"
    accent: none

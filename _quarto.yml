project:
  type: default
  resources:
    - assets/quarto-semantic-components.svg
    - quarto-semantic-components.pdf
    - quarto-semantic-components.docx

lang: en

# HTML remains configured in index.qmd. These format defaults are used when
# the same source is rendered with `--to pdf` or `--to docx`.
format:
  pdf:
    toc: true
    pdf-engine: lualatex
    include-in-header:
      - _extensions/semantic-components/qsc-pdf.tex
    geometry:
      - margin=22mm
  docx:
    toc: true
    reference-doc: assets/qsc-reference.docx

# Quarto Semantic Components project defaults.
# These values are inherited by every .qmd in the project.
extensions:
  badge:
    - key: stable
      label: Stable
      type: success
      appearance: solid
      icon: "✓"
    - key: experimental
      label: Experimental
      type: info
      appearance: outline
      icon: "⚗"
    - key: deprecated
      label: Deprecated
      type: danger
      appearance: soft
      icon: "!"

  steps:
    dot-size: "0.72rem"
    line-width: "1.5px"

  roadmap:
    orientation: horizontal
    curve: "0.6"
    markers: dot

  tree:
    expanded: true
    indent: "1.5rem"

  file-tree:
    icons: devicon
    expanded: true
    indent: "1.8rem"

  properties:
    term-width: "9rem"

  git-tree:
    direction: TB
    line-width: "2px"
    node-size: "0.68rem"
    lane-gap: "0.82rem"
    row-height: "36px"
    content-gap: "0.55rem"

  article:
    radius: "0.75rem"
    padding: "1rem 1.1rem"
    accent: none
